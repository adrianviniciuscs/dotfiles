# UserKeybinds.conf - Configuração Definitiva e Organizada
# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */ #

# --- Variáveis Iniciais ---
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# Carrega definições de Terminal e Gerenciador de Arquivos padrão
source = $UserConfigs/01-UserDefaults.conf

# ==============================================================================
#   🚀 LANÇADORES DE APLICATIVOS (ESSENCIAIS)
# ==============================================================================
bind = $mainMod, Return, exec, $term        # Terminal
bind = $mainMod, E, exec, $files             # Gerenciador de Arquivos
bind = $mainMod, D, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window # Menu de Apps
bind = $mainMod, B, exec, xdg-open "https://" # Navegador Padrão

# --- Seus Apps Específicos ---
# (Prioridade sobre os atalhos originais)
bind = $mainMod, O, exec, flatpak run md.obsidian.Obsidian --socket=session-bus  # Obsidian
bind = $mainMod, S, exec, spotify                           # Spotify
bind = $mainMod, C, exec, code                              # VS Code
bind = $mainMod, A, exec, antigravity                       # Antigravity

# --- Atalhos Originais (Remapeados para evitar conflito) ---
bind = $mainMod CTRL, S, exec, $scriptsDir/RofiSearch.sh   # Pesquisa Google (Era Super+S)
bind = $mainMod ALT, A, exec, pkill rofi || true && ags -t 'overview' # Overview Desktop (Era Super+A)

# ==============================================================================
#   🪟 GERENCIAMENTO DE JANELAS
# ==============================================================================
bind = $mainMod SHIFT, F, fullscreen          # Tela cheia real (Oculta tudo)
bind = $mainMod CTRL, F, fullscreen, 1        # "Fake" fullscreen (Mantém barra)
bind = $mainMod, SPACE, togglefloating        # Flutuar janela atual
bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat # Flutuar TUDO na workspace
bind = $mainMod SHIFT, Return, exec, [float; move 15% 5%; size 70% 60%] $term # Terminal Flutuante Rápido

bind = $mainMod CTRL, O, exec, hyprctl setprop active opaque toggle # Ligar/Desligar opacidade na janela ativa

# ==============================================================================
#   🛠️ SCRIPTS E UTILITÁRIOS (JA KOO LIT EXTRAS)
# ==============================================================================
bind = $mainMod SHIFT, H, exec, $scriptsDir/KeyHints.sh     # Folha de dicas de atalhos
bind = $mainMod ALT, R, exec, $scriptsDir/Refresh.sh        # Recarregar Waybar/Configs
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh      # Menu de Emojis
bind = $mainMod ALT, V, exec, $scriptsDir/ClipManager.sh    # Histórico de Transferência (Clipboard)
bind = $mainMod ALT, C, exec, $UserScripts/RofiCalc.sh      # Calculadora

# --- Customização Visual ---
bind = $mainMod CTRL, R, exec, $scriptsDir/RofiThemeSelector.sh          # Mudar tema do Rofi
bind = $mainMod CTRL SHIFT, R, exec, $scriptsDir/RofiThemeSelector-modified.sh # Mudar tema do Rofi (Modo 2)
bind = $mainMod ALT, O, exec, $scriptsDir/ChangeBlur.sh     # Ligar/Desligar Blur
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh     # Modo Jogo (Desliga animações)
bind = $mainMod ALT, L, exec, $scriptsDir/ChangeLayout.sh   # Alternar Layout (Dwindle/Master)
bind = $mainMod SHIFT, A, exec, $scriptsDir/Animations.sh   # Menu de Animações
bind = $mainMod SHIFT, O, exec, $UserScripts/ZshChangeTheme.sh # Mudar tema do Terminal (ZSH)
bind = $mainMod SHIFT, K, exec, $scriptsDir/KeyBinds.sh     # Pesquisar atalhos no Rofi

# --- Seus Scripts Personalizados ---
bind = $mainMod SHIFT, T, exec, $UserScripts/AlacrittyChangeTheme.sh # Mudar tema do Alacritty
bind = $mainMod ALT, A, exec, pkill RainbowBorders.sh || $UserScripts/RainbowBorders.sh # Ligar/Desligar Bordas Coloridas

# ==============================================================================
#   🎨 WALLPAPERS E MÍDIA
# ==============================================================================
bind = $mainMod, W, exec, $UserScripts/WallpaperSelect.sh   # Selecionar Wallpaper
bind = $mainMod SHIFT, W, exec, $UserScripts/WallpaperEffects.sh # Efeitos no Wallpaper
bind = CTRL ALT, W, exec, $UserScripts/WallpaperRandom.sh   # Wallpaper Aleatório

bind = $mainMod SHIFT, M, exec, $UserScripts/RofiBeats.sh   # Player de Música (Rofi Beats)

# ==============================================================================
#   💻 SISTEMA E HARDWARE
# ==============================================================================

# --- Zoom (Lupa) - Compatível com Hyprland 0.39/Ubuntu ---
bind = $mainMod ALT, mouse_down, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bind = $mainMod ALT, mouse_up, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"

# --- Waybar (Barra de Tarefas) ---
bind = $mainMod CTRL ALT, B, exec, pkill -SIGUSR1 waybar    # Esconder/Mostrar Barra
bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh  # Menu de Estilos da Barra
bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh   # Menu de Layout da Barra


# --- Controle de Luz Azul (Hyprshift) ---

 bind = $mainMod, F7, exec, sunset down
 bind = $mainMod, F8, exec, sunset up
 bind = $mainMod, F9, exec, sunset reset

# --- Teclado ---
# Troca de Layout (ABNT2/US). Comentado para evitar bugs em jogos. 
# Descomente se usar múltiplos idiomas.
# bindln = ALT_L, SHIFT_L, exec, $scriptsDir/SwitchKeyboardLayout.sh
