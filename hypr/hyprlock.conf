# Hyprlock Minimalista & Clean
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
    grace = 1
    # fractional_scaling = 2 # Cuidado: isso pode bugar em monitores 1080p, deixei comentado por segurança.
    no_fade_in = false
    no_fade_out = false
    immediate_render = true
}

# --- Fundo (Wallpaper com Blur) ---
background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(0,0,0)
    
    # Efeito de Blur pesado para focar no relógio
    blur_size = 4
    blur_passes = 3 
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# --- Hora (Grande e Centralizada) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $color15 # Usei cor clara (branco do tema) para leitura melhor
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -60
    halign = center
    valign = center
    
    # Sombra para destacar do fundo
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
}

# --- Sua Foto (Avatar) ---
image {
    monitor =
    # path = /home/adrian/Pictures/Fotos/me/tuxsquare.png # <--- CAMINHO DA SUA FOTO AQUI
    size = 80 # Tamanho da imagem
    rounding = -1 # -1 faz ela ficar um círculo perfeito
    border_size = 3
    border_color = $color13 # Usando a cor de destaque do tema
    
    position = 0, 190 # Ajustei a altura para ficar acima do campo de senha
    halign = center
    valign = bottom
}

# --- Data (Abaixo da Hora) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(LC_TIME=pt_BR.UTF-8 date +'%A, %d de %B')" | sed 's/\b\w/\u&/g'
    color = $color13 # Cor de destaque do tema
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -160
    halign = center
    valign = center
}

# --- Ícone do Usuário ---
label {
    monitor =
    text = 🦫 $USER
    color = $color13
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = bottom
}

# --- Campo de Senha ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    
    # Cores do Wallust
    outer_color = $color11
    inner_color = rgba(0, 0, 0, 0.2) # Fundo levemente escuro
    font_color = $color15
    
    # Feedback de Erro/Verificação
    fade_on_empty = false
    placeholder_text = <i>Senha...</i> # Texto quando vazio
    hide_input = false
    
    # Cores de status
    check_color = $color10 # Cor ao dar Enter
    fail_color = $color9   # Cor se errar a senha
    fail_text = <i>Falha ($ATTEMPTS)</i> # Texto de erro
    capslock_color = $color11

    position = 0, 90
    halign = center
    valign = bottom
}