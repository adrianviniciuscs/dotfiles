# WindowRules.conf - Regras de Janelas

# -----------------------------------------------------
# 1. Regras de Flutuação (Floating)
# Janelas que devem "soltas" na tela, não presas na grade
# -----------------------------------------------------
windowrulev2 = float, class:^(org.kde.polkit-kde-authentication-agent-1)$ 
windowrulev2 = float, class:^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrulev2 = float, class:^(nm-applet|nm-connection-editor|blueman-manager)$
windowrulev2 = float, class:^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$
windowrulev2 = float, class:^(wihotspot(-gui)?)$
windowrulev2 = float, class:^(evince|file-roller|org.gnome.FileRoller|org.gnome.Baobab)$
windowrulev2 = float, class:^(nwg-look|qt5ct|qt6ct|kvantummanager)$
windowrulev2 = float, class:^(mpv|vlc|com.github.rafostar.Clapper)$
windowrulev2 = float, class:^(eog|org.gnome.Loupe|viewnior)$
windowrulev2 = float, class:^(yad)$
windowrulev2 = float, class:^(Rofi)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(ROG Control)$
windowrulev2 = float, title:^(KooL Quick Cheat Sheet)$
windowrulev2 = float, title:^(OBS)$

# Janelas de diálogo específicas (Salvar como, Confirmar, Calculadora)
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(org.gnome.Calculator), title:^(Calculator)$
windowrulev2 = float, class:^(thunar), title:(File Operation Progress)$
windowrulev2 = float, class:^(thunar), title:(Confirm to replace files)$
windowrulev2 = float, class:^(electron), title:(Add Folder to Workspace)$

# Steam: Janela principal em grade, mas amigos e configurações flutuam
windowrulev2 = float, class:^([Ss]team)$,title:^((?![Ss]team).*|[Ss]team [Ss]ettings)$

# -----------------------------------------------------
# 2. Posição e Tamanho e Foco
# -----------------------------------------------------
windowrulev2 = center, title:^(KooL Quick Cheat Sheet)$
windowrulev2 = center, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = size 60% 70%, class:^(pavucontrol|org.pulseaudio.pavucontrol)$

# Picture-in-Picture (Firefox/Chrome)
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = move 72% 7%, title:^(Picture-in-Picture)$
windowrulev2 = size 25% 25%, title:^(Picture-in-Picture)$
windowrulev2 = keepaspectratio, title:^(Picture-in-Picture)$

# Evitar que fullscreen desligue a tela (assistindo filme)
windowrulev2 = idleinhibit fullscreen, fullscreen:1

# -----------------------------------------------------
# 3. Workspaces (Áreas de Trabalho)
# Define onde cada app abre automaticamente
# -----------------------------------------------------
# Workspace 1: Email e Produtividade
windowrulev2 = workspace 1, class:^(Thunderbird|eu.betterbird.Betterbird|org.gnome.Evolution)$

# Workspace 2: Navegadores
windowrulev2 = workspace 2, class:^(Firefox|org.mozilla.firefox|firefox-esr)$
windowrulev2 = workspace 2, class:^(Microsoft-edge(-stable|-beta|-dev|-unstable)?)$
windowrulev2 = workspace 2, class:^(Google-chrome(-beta|-dev|-unstable)?)$
windowrulev2 = workspace 2, class:^(Brave-browser(-beta|-dev)?)$
windowrulev2 = workspace 2, class:^(Thorium-browser|Cachy-browser)$

# Workspace 4: Criação/Streaming
windowrulev2 = workspace 4, class:^(com.obsproject.Studio)$

# Workspace 5: Jogos
windowrulev2 = workspace 5, class:^(Steam|Lutris|Heroic)$

# Workspace 6: Máquinas Virtuais (Silencioso para não mudar o foco sozinho)
windowrulev2 = workspace 6 silent, class:^(virt-manager)$

# Workspace 7: Chat e Social
windowrulev2 = workspace 7, class:^(discord|WebCord|Vesktop)$
windowrulev2 = workspace 7, class:^(Ferdium|Whatsapp-for-linux|teams-for-linux)$

# Workspace 9: Música
windowrulev2 = workspace 9 silent, class:^(Audacious|Spotify)$

# -----------------------------------------------------
# 4. Opacidade (Transparência)
# Formato: opacity [ativo] [inativo]
# -----------------------------------------------------
# Terminais e Editores
windowrulev2 = opacity 0.9 0.8, class:^(Alacritty|kitty|kitty-dropterm)$
windowrulev2 = opacity 0.9 0.8, class:^(VSCode|code-url-handler|VSCodium|code-oss)$
windowrulev2 = opacity 0.9 0.8, class:^(jetbrains-.+)$
windowrulev2 = opacity 0.9 0.9, class:^(Obsidian)$

# Navegadores (Cuidado: muito transparente atrapalha ler sites)
windowrulev2 = opacity 0.95 0.85, class:^(Firefox|org.mozilla.firefox)$
windowrulev2 = opacity 0.95 0.85, class:^(Google-chrome|Brave-browser)$

# Ferramentas do Sistema
windowrulev2 = opacity 0.9 0.8, class:^(Thunar|org.gnome.Nautilus|pcmanfm-qt)$
windowrulev2 = opacity 0.9 0.8, class:^(nwg-look|qt5ct|qt6ct|yad)$
windowrulev2 = opacity 0.82 0.75, class:^(gnome-system-monitor|org.gnome.SystemMonitor)$
windowrulev2 = float, title:^(Gradia|gradia)
windowrulev2 = size 1400 900, title:^(Gradia|gradia)

# Chat
windowrulev2 = opacity 0.94 0.86, class:^(discord|Vesktop|WebCord)$
windowrulev2 = opacity 0.9 0.8, class:^(org.telegram.desktop)$

# -----------------------------------------------------
# 5. Layer Rules (Regras de Camada)
# Efeitos para menus como Rofi
# -----------------------------------------------------
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, waybar
layerrule = ignorezero, waybar

# -----------------------------------------------------
# 6. SEUS PROJETOS PESSOAIS (Crucial!)
# -----------------------------------------------------

# --- HyprZap (WhatsApp Electron Custom) ---
windowrulev2 = float, title:^(hyprzap)$
windowrulev2 = size 1100 750, title:^(hyprzap)$
windowrulev2 = center, title:^(hyprzap)$
windowrulev2 = opacity 0.90 0.80, title:^(hyprzap)$

# ---------------------------------------------------- 
# 7. CONFIGURAÇÃO DE MONITORES 
# --------------------------------------------------
# --- Monitor Laptop (eDP-1): Workspaces 1 a 5 ---
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1

# --- Monitor HDMI (HDMI-A-2): Workspaces 6 a 10 ---
workspace = 6, monitor:HDMI-A-2
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2
workspace = 9, monitor:HDMI-A-2
workspace = 10, monitor:HDMI-A-2

# --- Correções para OBS Studio ---

# 1. Forçar janelas de diálogo/propriedades a serem flutuantes (Floating)
# A regex title:^(?!OBS).*$ pega qualquer janela dessa classe que NÃO comece com "OBS"
windowrulev2 = float,class:(com.obsproject.Studio),title:^(?!OBS).*$

# 2. Centralizar essas janelas na tela atual (evita abrir no canto ou outro monitor)
windowrulev2 = center,class:(com.obsproject.Studio),title:^(?!OBS).*$

# Força o popup a abrir no mesmo workspace da janela ativa
windowrulev2 = workspace current,class:(com.obsproject.Studio),title:^(?!OBS).*$
