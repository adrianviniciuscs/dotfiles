# Laptops.conf - Configurações Genéricas

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts

# --- 1. ID do Touchpad ---
# Rode 'hyprctl devices' no terminal para descobrir o nome do seu e cole abaixo
$Touchpad_Device = elan0b00:00-04f3:3192-touchpad  # <--- EXEMPLO, MUDE ISTO!

# --- 2. Controle de Brilho ---
binde = , xf86KbdBrightnessDown, exec, $scriptsDir/BrightnessKbd.sh --dec
binde = , xf86KbdBrightnessUp, exec, $scriptsDir/BrightnessKbd.sh --inc
binde = , xf86MonBrightnessDown, exec, $scriptsDir/Brightness.sh --dec
binde = , xf86MonBrightnessUp, exec, $scriptsDir/Brightness.sh --inc

# --- 3. Controle de Touchpad ---
bind = , xf86TouchpadToggle, exec, $scriptsDir/TouchPad.sh # Ativa/Desativa touchpad

# --- 4. Configuração Específica do Dispositivo ---
$TOUCHPAD_ENABLED = true
device {
  name = $Touchpad_Device
  enabled = $TOUCHPAD_ENABLED
  # sensibilidade pode ser ajustada aqui se quiser, ex: sensitivity = 0.5
}

# --- 5. Comportamento ao fechar a tampa (Lid Switch) ---
# Se usar monitor externo, descomente a linha abaixo para desligar a tela do note ao fechar
# bindl = , switch:on:Lid Switch,exec,hyprctl keyword monitor "eDP-1, disable"
# bindl = , switch:off:Lid Switch,exec,hyprctl keyword monitor "eDP-1, preferred, auto, 1"
