# Hyprlock minimalista
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(0,0,0)
    blur_size = 3
    blur_passes = 2
    noise = 0.01
    contrast = 1.1
    brightness = 0.85
    vibrancy = 0.1
}

# Hour
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $color13
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -100
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = $color13
    font_size = 20
    font_family = Victor Mono Bold Oblique
    position = 0, 200
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color11
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $color13
    capslock_color = rgb(255,255,255)
    fade_on_empty = false
    font_family = JetBrains Mono
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

